[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/core",
    "crates/currency",
    "crates/state",
    "crates/ohm",
    "crates/gas",
    "crates/treasury",
    "crates/rewards",
    "crates/audit",
    "crates/net",
    "crates/consensus",
    "crates/master",
    "crates/node",
    "crates/wallet",
    "crates/wallet-rpc",
    "crates/wallet-rpc-client",
    "crates/solid",
    "crates/ovm",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/oxydome"

[workspace.dependencies]
oxydome-crypto = { path = "crates/crypto" }
oxydome-core = { path = "crates/core" }
oxydome-currency = { path = "crates/currency" }
oxydome-state = { path = "crates/state" }
oxydome-ohm = { path = "crates/ohm" }
oxydome-gas = { path = "crates/gas" }
oxydome-treasury = { path = "crates/treasury" }
oxydome-rewards = { path = "crates/rewards" }
oxydome-audit = { path = "crates/audit" }
oxydome-net = { path = "crates/net" }
oxydome-consensus = { path = "crates/consensus" }
oxydome-master = { path = "crates/master" }
oxydome-node = { path = "crates/node" }
oxydome-wallet = { path = "crates/wallet" }
oxydome-wallet-rpc = { path = "crates/wallet-rpc" }
oxydome-wallet-rpc-client = { path = "crates/wallet-rpc-client" }
oxydome-ovm = { path = "crates/ovm" }
bech32 = "0.9"
sha3 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sled = "0.34"
thiserror = "1"
hex = "0.4"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tempfile = "3"
proptest = "1"

axum = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
bip39 = "2"
aes-gcm = "0.10"
scrypt = "0.11"
hmac = "0.12"
sha2 = "0.10"

anyhow = "1"

[profile.release]
opt-level = 3
